apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-gcp}
spec: {package: xpkg.upbound.io/upbound/provider-gcp:v1.5.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-azure}
spec: {package: xpkg.upbound.io/upbound/provider-azure:v1.5.0}
---
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata: {name: default}
spec: {credentials: {source: Secret, secretRef: {name: azure-creds, namespace: crossplane-system, key: creds}}}
---
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata: {name: default}
spec: {projectID: replace-with-project, credentials: {source: Secret, secretRef: {name: gcp-creds, namespace: crossplane-system, key: creds}}}
