apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: {name: platform-demo-multicloud, namespace: argocd}
spec:
  generators:
    - clusters:
        selector: {matchExpressions: [{key: platform, operator: In, values: [gcp-gke, azure-aks]}]}
  template:
    metadata: {name: 'platform-demo-{{name}}'}
    spec:
      project: default
      source:
        repoURL: https://github.com/koushikbal/multicloud-gitops-argocd-crossplane.git
        targetRevision: main
        path: 'apps/overlays/{{metadata.labels.platform}}'
      destination: {server: '{{server}}', namespace: platform-demo}
      syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
